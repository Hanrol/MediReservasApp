name: medireservas-aws

x-backend: &backend
  restart: unless-stopped
  mem_limit: 512m
  mem_reservation: 256m
  depends_on:
    eureka:
      condition: service_started

x-java: &java
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError"
  EUREKA_URL: http://eureka:8761/eureka/

services:
  eureka:
    image: ${DOCKERHUB_USER}/medireservas-eureka:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError"

  auth:
    <<: *backend
    image: ${DOCKERHUB_USER}/medireservas-auth:${IMAGE_TAG}
    environment:
      <<: *java
      DB_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/auth_db?sslMode=REQUIRED
      DB_USER: auth_app
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MASTER_ADMIN_EMAIL: ${MASTER_ADMIN_EMAIL}

  users:
    <<: *backend
    image: ${DOCKERHUB_USER}/medireservas-users:${IMAGE_TAG}
    environment:
      <<: *java
      DB_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/users_db?sslMode=REQUIRED
      DB_USER: users_app
      DB_PASSWORD: ${USERS_DB_PASSWORD}
      MASTER_ADMIN_EMAIL: ${MASTER_ADMIN_EMAIL}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD}
      MASTER_ADMIN_RUN: ${MASTER_ADMIN_RUN}
      MASTER_ADMIN_FIRST_NAME: ${MASTER_ADMIN_FIRST_NAME:-Administrador}
      MASTER_ADMIN_LAST_NAME: ${MASTER_ADMIN_LAST_NAME:-Maestro}
      MASTER_ADMIN_DEPARTMENT: ${MASTER_ADMIN_DEPARTMENT:-Administración}
      MASTER_ADMIN_POSITION: ${MASTER_ADMIN_POSITION:-Administrador maestro}

  doctors:
    <<: *backend
    image: ${DOCKERHUB_USER}/medireservas-doctors:${IMAGE_TAG}
    environment:
      <<: *java
      DB_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/doctors_db?sslMode=REQUIRED
      DB_USER: doctors_app
      DB_PASSWORD: ${DOCTORS_DB_PASSWORD}

  appointments:
    <<: *backend
    image: ${DOCKERHUB_USER}/medireservas-appointments:${IMAGE_TAG}
    environment:
      <<: *java
      DB_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/appointments_db?sslMode=REQUIRED
      DB_USER: appointments_app
      DB_PASSWORD: ${APPOINTMENTS_DB_PASSWORD}

  medical-records:
    <<: *backend
    image: ${DOCKERHUB_USER}/medireservas-medical-records:${IMAGE_TAG}
    environment:
      <<: *java
      DB_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/medical_records_db?sslMode=REQUIRED
      DB_USER: medical_records_app
      DB_PASSWORD: ${MEDICAL_RECORDS_DB_PASSWORD}

  gateway:
    <<: *backend
    image: ${DOCKERHUB_USER}/medireservas-gateway:${IMAGE_TAG}
    environment:
      <<: *java
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "127.0.0.1:9013:9013"
