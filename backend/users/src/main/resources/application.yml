spring:
    application:
        name: users-service
    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3311/users_db}
        username: ${DB_USER:users_app}
        password: ${DB_PASSWORD:users_dev_123}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: none
        database-platform: org.hibernate.dialect.MySQLDialect
    flyway:
        enabled: true
        locations: classpath:db/migration

server:
    port: 9002

eureka:
    client:
        service-url:
            defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
        register-with-eureka: true
        fetch-registry: true
    instance:
        prefer-ip-address: true
        lease-renewal-interval-in-seconds: 30
        lease-expiration-duration-in-seconds: 90

logging:
    level:
        root: INFO
        cl.duoc.users: DEBUG
    file:
        name: logs/users-service.log
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
        file: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui/index.html

app:
    master-admin:
        email: ${MASTER_ADMIN_EMAIL:}
        password: ${MASTER_ADMIN_PASSWORD:}
        run: ${MASTER_ADMIN_RUN:}
        first-name: ${MASTER_ADMIN_FIRST_NAME:Administrador}
        last-name: ${MASTER_ADMIN_LAST_NAME:Maestro}
        department: ${MASTER_ADMIN_DEPARTMENT:Administración}
        position: ${MASTER_ADMIN_POSITION:Administrador maestro}

management:
    endpoints:
        web:
            exposure:
                include: health, info
    endpoint:
        health:
            show-details: always
