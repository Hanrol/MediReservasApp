name: medireservas-databases

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_medireservas_db
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --performance-schema=OFF
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3311:3306"
    volumes:
      - medireservas_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  medireservas_mysql_data:
