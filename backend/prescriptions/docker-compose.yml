services:
  mysql:
    image: mysql:8.0
    container_name: mysql_prescriptions_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prescriptions_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3319:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql