server:
  port: 9013

spring:
  application:
    name: gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      routes:
        # AUTH SERVICE
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v3/auth/**

        # USERS SERVICE
        - id: users-service
          uri: lb://users-service
          predicates:
            - Path=/api/v3/users/**,/api/v3/user-profiles/**,/api/v3/patient-profiles/**,/api/v3/receptionist-profiles/**,/api/v3/administrator-profiles/**,/api/v3/patient-registrations/**

        # DOCTORS SERVICE
        - id: doctors-service
          uri: lb://doctors-service
          predicates:
            - Path=/api/v3/doctors/**,/api/v3/specialties/**

        # APPOINTMENTS SERVICE
        - id: appointments-service
          uri: lb://appointments-service
          predicates:
            - Path=/api/v3/appointments/**,/api/v3/doctor-schedules/**,/api/v3/doctor-time-off/**,/api/v3/schedule-slots/**

        # MEDICAL RECORDS SERVICE
        - id: medical-records-service
          uri: lb://medical-records-service
          predicates:
            - Path=/api/v3/medical-records/**,/api/v3/medical-visit/**,/api/v3/diagnoses/**,/api/v3/vital-signs/**

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
