# Configuración del microservicio de citas médicas
spring:
  application:
    name: appointments-service
  datasource:
    url: jdbc:mysql://localhost:3316/appointments_db
    username: admin
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

# Puerto del servidor
server:
  port: 9006

# Eureka Client (descomentar cuando se active el discovery server)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Configuración de logging
logging:
  level:
    root: INFO
    cl.duoc.appointments: DEBUG
  file:
    name: logs/appointments-service.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss}  - %msg%n"

# SpringDoc OpenAPI - Swagger UI
springdoc:
  api-docs:
    path: v3/api-docs
  swagger-ui:
    path: swagger-ui/index.html

# Actuator - health check
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
