name: medireservas-e2e

x-backend: &backend
  restart: "no"
  environment: &backend-environment
    EUREKA_URL: http://eureka:8761/eureka/
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
  depends_on:
    eureka:
      condition: service_started
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    command:
      - --innodb-buffer-pool-size=192M
      - --max-connections=30
      - --performance-schema=OFF
    mem_limit: 384m
    environment:
      MYSQL_ROOT_PASSWORD: e2e_root_only_change_me
      AUTH_DB_PASSWORD: e2e_auth_only
      USERS_DB_PASSWORD: e2e_users_only
      DOCTORS_DB_PASSWORD: e2e_doctors_only
      APPOINTMENTS_DB_PASSWORD: e2e_appointments_only
      MEDICAL_RECORDS_DB_PASSWORD: e2e_medical_records_only
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  eureka:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: eureka

  auth:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: auth
    environment:
      <<: *backend-environment
      DB_URL: jdbc:mysql://mysql:3306/auth_db
      DB_USER: auth_app
      DB_PASSWORD: e2e_auth_only
      JWT_SECRET: e2e-only-jwt-secret-do-not-use-outside-tests-123456789
      MASTER_ADMIN_EMAIL: admin-e2e@medireservas.local

  users:
    <<: *backend
    depends_on:
      auth:
        condition: service_started
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: users
    environment:
      <<: *backend-environment
      DB_URL: jdbc:mysql://mysql:3306/users_db
      DB_USER: users_app
      DB_PASSWORD: e2e_users_only
      MASTER_ADMIN_EMAIL: admin-e2e@medireservas.local
      MASTER_ADMIN_PASSWORD: E2eAdmin123!
      MASTER_ADMIN_RUN: 11.111.111-1
      MASTER_ADMIN_FIRST_NAME: Administrador
      MASTER_ADMIN_LAST_NAME: E2E
      MASTER_ADMIN_DEPARTMENT: Pruebas
      MASTER_ADMIN_POSITION: Automatización E2E

  doctors:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: doctors
    environment:
      <<: *backend-environment
      DB_URL: jdbc:mysql://mysql:3306/doctors_db
      DB_USER: doctors_app
      DB_PASSWORD: e2e_doctors_only

  appointments:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: appointments
    environment:
      <<: *backend-environment
      DB_URL: jdbc:mysql://mysql:3306/appointments_db
      DB_USER: appointments_app
      DB_PASSWORD: e2e_appointments_only

  medical-records:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: medical-records
    environment:
      <<: *backend-environment
      DB_URL: jdbc:mysql://mysql:3306/medical_records_db
      DB_USER: medical_records_app
      DB_PASSWORD: e2e_medical_records_only

  gateway:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: gateway
    ports:
      - "127.0.0.1:${E2E_GATEWAY_PORT:-19013}:9013"

volumes:
  mysql_data:
