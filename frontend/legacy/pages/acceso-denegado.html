<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Acceso restringido a una sección de MediReservas.">
        <meta name="robots" content="noindex, nofollow">
        <title>Acceso restringido | MediReservas</title>
        <link rel="stylesheet" href="../assets/css/style.css">
    </head>

    <body class="grid min-h-screen place-items-center bg-page px-4 py-10 text-ink antialiased sm:px-6"
        data-page-name="Acceso restringido">
        <a class="fixed left-4 top-4 z-60 -translate-y-24 rounded-lg bg-white px-4 py-2 font-semibold text-primary-dark shadow-xl transition focus:translate-y-0"
            href="#main-content">Saltar al contenido principal</a>
        <main class="w-full max-w-xl" id="main-content" tabindex="-1">
            <section class="overflow-hidden rounded-3xl border border-line bg-white shadow-xl"
                aria-labelledby="access-title">
                <div class="bg-primary-dark px-6 py-8 text-center text-white sm:px-10 sm:py-10">
                    <span class="mx-auto grid size-16 place-items-center rounded-2xl bg-white/15 text-3xl font-bold"
                        aria-hidden="true">!</span>
                    <p class="mt-6 text-sm font-bold uppercase tracking-widest text-emerald-200">Acceso restringido</p>
                    <h1 class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl" id="access-title">No tienes permiso
                        para ingresar</h1>
                </div>
                <div class="p-6 text-center sm:p-10">
                    <p class="leading-7 text-muted">Tu sesión está activa, pero el perfil asociado a tu cuenta no puede
                        acceder a esta sección.</p>
                    <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
                        <a class="rounded-xl bg-primary px-5 py-3 font-semibold text-white transition hover:bg-primary-dark"
                            href="dashboard.html">Volver al panel</a>
                        <button
                            class="rounded-xl border border-line px-5 py-3 font-semibold text-primary-dark transition hover:bg-primary-light"
                            id="logout-button" type="button">Cerrar sesión</button>
                    </div>
                </div>
            </section>

            <a class="mx-auto mt-6 block w-fit text-sm font-semibold text-primary-dark hover:underline"
                href="../index.html">Ir al inicio de MediReservas</a>
        </main>

        <script type="module" src="../assets/js/logout.js"></script>
    </body>

</html>
