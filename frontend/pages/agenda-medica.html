<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Agenda médica diaria del profesional en MediReservas." />
        <title>Mi agenda | MediReservas</title>
        <link rel="stylesheet" href="../assets/css/style.css" />
        <script type="module" src="../assets/js/route-guard.js"></script>
    </head>
    <body class="flex min-h-screen flex-col bg-page text-ink antialiased" data-page-name="Mi agenda" data-auth-required>
        <a
            class="fixed left-4 top-4 z-60 -translate-y-24 rounded-lg bg-white px-4 py-2 font-semibold text-primary-dark shadow-xl transition focus:translate-y-0"
            href="#main-content"
            >Saltar al contenido principal</a
        >
        <header class="relative z-30 border-b border-line bg-white">
            <nav class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8" aria-label="Barra superior de MediReservas">
                <div class="flex items-center gap-3">
                    <button
                        class="grid size-10 place-items-center rounded-xl border border-line bg-white text-xl text-primary-dark transition hover:bg-primary-light lg:hidden"
                        id="mobile-menu-button"
                        type="button"
                        aria-controls="shared-mobile-sidebar"
                        aria-expanded="false"
                        aria-label="Abrir menú de navegación"
                    >
                        <span class="leading-none" aria-hidden="true">☰</span>
                    </button>
                    <a class="flex items-center gap-2 text-lg font-bold text-primary-dark sm:text-xl" href="../index.html" aria-label="Ir al inicio de MediReservas">
                        <span class="grid size-10 place-items-center rounded-xl bg-primary text-xl text-white" aria-hidden="true">+</span>
                        <span class="hidden sm:inline">MediReservas</span>
                    </a>
                </div>

                <div class="flex items-center gap-3 sm:gap-5">
                    <a class="text-right" href="perfil.html" aria-label="Ver mi perfil">
                        <p class="text-sm font-semibold" id="header-user-name">Usuario</p>
                        <p class="text-xs text-muted" id="header-user-role">Perfil</p>
                    </a>
                    <button
                        class="inline-flex items-center justify-center rounded-xl border border-line bg-white px-3 py-2.5 text-sm font-semibold text-primary-dark transition hover:border-red-200 hover:bg-red-50 hover:text-red-600 sm:px-4"
                        id="logout-button"
                        type="button"
                    >
                        <span class="sm:hidden">Salir</span>
                        <span class="hidden sm:inline">Cerrar sesión</span>
                    </button>
                </div>
            </nav>
        </header>

        <main class="flex-1 px-4 py-8 sm:px-6 sm:py-12 lg:px-8" id="main-content" tabindex="-1">
            <section class="mx-auto max-w-5xl" aria-labelledby="agenda-title">
                <header>
                    <p class="text-sm font-bold uppercase tracking-widest text-primary">Médico</p>
                    <h1 class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl" id="agenda-title">Mi agenda</h1>
                    <p class="mt-3 text-muted">Revisa tus citas del día y registra la observación clínica de cada atención.</p>
                </header>

                <form class="mt-8 rounded-2xl border border-line bg-white p-5 shadow-sm sm:max-w-sm" id="agenda-filter-form">
                    <label class="mb-2 block text-sm font-semibold" for="agenda-date">Ver agenda del día</label>
                    <input
                        class="w-full rounded-xl border border-line px-4 py-3 outline-none transition focus:border-primary focus:ring-3 focus:ring-emerald-100"
                        id="agenda-date"
                        name="date"
                        type="date"
                    />
                </form>

                <div class="mt-6" aria-live="polite">
                    <p class="text-sm font-medium text-muted" id="agenda-result-count"></p>
                </div>

                <ul class="mt-3 grid gap-4" id="agenda-list"></ul>

                <p class="mt-6 rounded-2xl border border-line bg-white p-8 text-center text-muted" id="agenda-empty-message" hidden>
                    No tienes citas registradas para la fecha seleccionada.
                </p>
            </section>
        </main>

        <footer class="border-t border-line bg-white px-4 py-5 text-center text-sm text-muted">
            <p>&copy; 2026 MediReservas. Todos los derechos reservados.</p>
        </footer>
        <script type="module" src="../assets/js/agenda-medica.js"></script>
        <script type="module" src="../assets/js/navigation.js"></script>
        <script type="module" src="../assets/js/logout.js"></script>
    </body>
</html>
